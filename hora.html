<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta Regresiva</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#e5e5e5;
    font-family:'Montserrat', sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.titulo{
    font-size:65px;
    margin-bottom:20px;
    text-align:center;
}

.reloj{
    display:flex;
    align-items:flex-end;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.label{
    font-size:22px;
    color:black;
    text-transform:uppercase;
    letter-spacing:0.08em;
}

.caja{
    background:black;
    color:white;
    font-size:100px;
    padding:25px 35px;
    text-align:center;
    min-width:110px;
}

.pm{
    background:black;
    color:white;
    font-size:35px;
    padding:15px;
    border-radius:12px;
}

.sub{
    margin-top:40px;
    font-size:45px;
    text-align:center;
}

.sub2{
    margin-top:10px;
    font-size:45px;
    text-align:center;
}

@media (max-width: 900px){
    .titulo{
        font-size:40px;
    }

    .caja{
        font-size:60px;
        min-width:80px;
        padding:20px;
    }

    .sub,
    .sub2{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="titulo">COMENZAMOS EN BREVE</div>

<div class="reloj">

    <div class="col">
        <div class="caja" id="dias">00</div>
        <div class="label">Días</div>
    </div>

    <div class="col">
        <div class="caja" id="hora">00</div>
        <div class="label">Horas</div>
    </div>

    <div class="col">
        <div class="caja" id="min">00</div>
        <div class="label">Minutos</div>
    </div>

    <div class="col">
        <div class="caja" id="seg">00</div>
        <div class="label">Segundos</div>
    </div>

    <div class="col">
        <div class="pm" id="ampm">PM</div>
        <div class="label">&nbsp;</div>
    </div>

</div>

<div class="sub">¿ESTÁS PREPARADO?</div>
<div class="sub2">PANEL FORUM</div>

<script>

function getObjetivo() {
    return new Date(
        2026, // año
        5,    // junio (0=enero, 5=junio)
        20,   // día
        16,   // hora (4 PM)
        30,   // minutos
        0,
        0
    );
}

function actualizarCuenta() {

    const ahora = new Date();
    const objetivo = getObjetivo();

    let diferencia = objetivo - ahora;

    if (diferencia <= 0) {
        document.getElementById('dias').textContent = '00';
        document.getElementById('hora').textContent = '00';
        document.getElementById('min').textContent = '00';
        document.getElementById('seg').textContent = '00';
        document.getElementById('ampm').textContent = 'PM';
        return;
    }

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    diferencia -= dias * (1000 * 60 * 60 * 24);

    const horas = Math.floor(diferencia / (1000 * 60 * 60));
    diferencia -= horas * (1000 * 60 * 60);

    const minutos = Math.floor(diferencia / (1000 * 60));
    diferencia -= minutos * (1000 * 60);

    const segundos = Math.floor(diferencia / 1000);

    document.getElementById('dias').textContent =
        dias < 10 ? '0' + dias : dias;

    document.getElementById('hora').textContent =
        horas < 10 ? '0' + horas : horas;

    document.getElementById('min').textContent =
        minutos < 10 ? '0' + minutos : minutos;

    document.getElementById('seg').textContent =
        segundos < 10 ? '0' + segundos : segundos;

    document.getElementById('ampm').textContent = 'PM';
}

actualizarCuenta();
setInterval(actualizarCuenta, 1000);

</script>

</body>
</html>
